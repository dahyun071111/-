<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>과제플랜 - 대학생 과제 일정 및 진행 관리</title>
    <style>
        /* CSS Reset 및 기본 스타일 설정 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        :root {
            --primary-color: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-primary: #1F2937;
            --text-secondary: #4B5563;
            --border-color: #E5E7EB;
            --danger-color: #EF4444;
            --warning-color: #F59E0B;
            --success-color: #10B981;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.5;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 헤더 영역 */
        header {
            background-color: var(--card-bg);
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .stat-item {
            background: #EEF2FF;
            padding: 8px 16px;
            border-radius: 20px;
            color: var(--primary-color);
        }

        /* 메인 레이아웃 Grid (PC 최적화) */
        .main-layout {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 24px;
            align-items: start;
        }

        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        /* 카드 기본 공통 디자인 */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 폼 스타일 (과제 등록/수정) */
        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-secondary);
        }

        .form-group label .required {
            color: var(--danger-color);
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary-color);
        }

        textarea.form-control {
            resize: vertical;
            height: 70px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
            flex: 1;
            text-align: center;
        }

        .btn-primary { background: var(--primary-color); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: #9CA3AF; color: white; }
        .btn-secondary:hover { background: #6B7280; }
        .btn-danger { background: var(--danger-color); color: white; }
        .btn-danger:hover { background: #DC2626; }
        .btn-sm { padding: 4px 8px; font-size: 12px; }

        /* 필터 및 검색 컨트롤 */
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
        }

        /* 메시지 상자 (알림 / 안내) */
        .alert-box {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }

        .alert-success { background: #D1FAE5; color: #065F46; border: 1px solid #A7F3D0; }
        .alert-error { background: #FEE2E2; color: #991B1B; border: 1px solid #FCA5A5; }
        .alert-info { background: #E0F2FE; color: #075985; border: 1px solid #BAE6FD; }

        /* 과제 리스트 카드 */
        .task-card {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
            background: white;
            position: relative;
        }

        .task-card:hover {
            box-shadow: 0 6px 12px -2px rgba(0,0,0,0.1);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .task-subject {
            font-size: 12px;
            font-weight: 700;
            color: var(--primary-color);
            background: #EEF2FF;
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 4px;
        }

        .task-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* 상태 및 남은 날짜 배지 */
        .badges {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .badge {
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        .badge-dday { background: #FEE2E2; color: #991B1B; }
        .badge-dday.imminent { background: #DC2626; color: white; animation: blink 1.5s infinite; }
        .badge-dday.completed-badge { background: #E5E7EB; color: #374151; }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .status-select {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        .status-NOT_STARTED { background: #F3F4F6; color: #4B5563; }
        .status-IN_PROGRESS { background: #FEF3C7; color: #D97706; }
        .status-COMPLETED { background: #D1FAE5; color: #059669; }

        /* 진행률 바 */
        .progress-section {
            margin: 12px 0;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .progress-bar-bg {
            background: #E5E7EB;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-bar-fill.done {
            background: var(--success-color);
        }

        /* 세부 계획 체크리스트 */
        .subtasks-list {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--border-color);
        }

        .subtask-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .subtask-item.completed span {
            text-decoration: line-through;
            color: #9CA3AF;
        }

        .subtask-item input[type="checkbox"] {
            cursor: pointer;
        }

        .task-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* 데이터 없음 안내 */
        .no-data {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
            background: white;
            border-radius: 8px;
            border: 1px dashed var(--border-color);
        }

        /* 모달 (세부 계획 수정용) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: white;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 헤더 영역 -->
        <header>
            <h1>
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                과제플랜 (TaskPlan)
            </h1>
            <div class="stats-bar">
                <div class="stat-item">전체 과제: <span id="stat-total">0</span>개</div>
                <div class="stat-item">진행 중: <span id="stat-in-progress">0</span>개</div>
                <div class="stat-item">완료: <span id="stat-completed">0</span>개</div>
            </div>
        </header>

        <!-- 알림 메시지 상자 -->
        <div id="global-alert" class="alert-box"></div>

        <!-- 메인 콘텐츠 (좌: 등록/수정 폼, 우: 과제 목록 및 일정) -->
        <div class="main-layout">
            <!-- 좌측: 과제 등록/수정 폼 -->
            <section class="card">
                <div class="card-title">
                    <span id="form-mode-title">새 과제 등록</span>
                    <button id="btn-reset-form" class="btn btn-secondary btn-sm" style="display:none;" onclick="resetForm()">취소</button>
                </div>
                <form id="task-form" onsubmit="handleFormSubmit(event)">
                    <input type="hidden" id="task-id">
                    
                    <div class="form-group">
                        <label for="subject-name">과목명 <span class="required">*</span></label>
                        <input type="text" id="subject-name" class="form-control" placeholder="예: 컴퓨터구조, 경영학개론">
                    </div>

                    <div class="form-group">
                        <label for="task-title">과제명 <span class="required">*</span></label>
                        <input type="text" id="task-title" class="form-control" placeholder="예: 중간고사 대체 보고서 작성">
                    </div>

                    <div class="form-group">
                        <label for="due-date">마감일시 <span class="required">*</span></label>
                        <input type="datetime-local" id="due-date" class="form-control">
                    </div>

                    <div class="form-group">
                        <label for="subtasks-input">세부 계획 (엔터로 구분하여 작성)</label>
                        <textarea id="subtasks-input" class="form-control" placeholder="1. 자료 조사&#10;2. 목차 작성&#10;3. 본문 작성 및 검토"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="task-status">진행 상태</label>
                        <select id="task-status" class="form-control">
                            <option value="NOT_STARTED">미시작</option>
                            <option value="IN_PROGRESS">진행 중</option>
                            <option value="COMPLETED">완료</option>
                        </select>
                    </div>

                    <div class="btn-group">
                        <button type="submit" id="btn-submit" class="btn btn-primary">과제 등록</button>
                    </div>
                </form>
            </section>

            <!-- 우측: 과제 조회 및 일정 관리 목록 -->
            <section class="card">
                <div class="card-title">
                    <span>과제 목록 및 진행 현황</span>
                </div>

                <!-- 검색 및 정렬 필터 -->
                <div class="controls">
                    <input type="text" id="search-input" class="form-control search-box" placeholder="과목명 또는 과제명 검색..." oninput="renderTasks()">
                    <select id="status-filter" class="form-control" style="width: 130px;" onchange="renderTasks()">
                        <option value="ALL">전체 상태</option>
                        <option value="NOT_STARTED">미시작</option>
                        <option value="IN_PROGRESS">진행 중</option>
                        <option value="COMPLETED">완료</option>
                    </select>
                    <select id="sort-order" class="form-control" style="width: 140px;" onchange="renderTasks()">
                        <option value="DUE_ASC">마감임박순</option>
                        <option value="DUE_DESC">마감여유순</option>
                        <option value="TITLE_ASC">과제명순</option>
                    </select>
                </div>

                <!-- 과제 목록 리스트 영역 -->
                <div id="task-list">
                    <!-- JS로 과제 항목이 dynamic하게 들어옵니다. -->
                </div>
            </section>
        </div>
    </div>

    <!-- 세부 계획 수정 모달 -->
    <div id="subtask-modal" class="modal-overlay">
        <div class="modal">
            <h3 class="card-title">세부 계획 수정</h3>
            <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 12px;">줄바꿈(Enter)으로 항목을 구분합니다.</p>
            <input type="hidden" id="modal-task-id">
            <textarea id="modal-subtask-text" class="form-control" style="height: 120px; margin-bottom: 16px;"></textarea>
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="closeSubtaskModal()">취소</button>
                <button class="btn btn-primary" onclick="saveSubtasksFromModal()">저장</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * 과제 데이터 구조 정의
         * Task = {
         *   id: string,
         *   subject: string,
         *   title: string,
         *   dueDate: string (ISO),
         *   status: 'NOT_STARTED' | 'IN_PROGRESS' | 'COMPLETED',
         *   subtasks: Array<{ id: string, text: string, completed: boolean }>
         * }
         */

        // 인메모리 과제 데이터베이스
        let tasks = [];

        // 초기화 함수
        window.onload = function() {
            loadTasks();
            renderTasks();
        };

        // 데이터 로드 (localStorage)
        function loadTasks() {
            try {
                const stored = localStorage.getItem('taskplan_tasks');
                if (stored) {
                    tasks = JSON.parse(stored);
                }
            } catch (e) {
                showAlert('데이터를 로드하는 중 오류가 발생했습니다.', 'error');
                tasks = [];
            }
        }

        // 데이터 저장 (localStorage)
        function saveTasksToStorage() {
            try {
                localStorage.setItem('taskplan_tasks', JSON.stringify(tasks));
            } catch (e) {
                showAlert('데이터 저장 실패 (용량 초과 등)', 'error');
            }
        }

        // 글로벌 알림 메시지 출력
        function showAlert(message, type = 'info') {
            const alertBox = document.getElementById('global-alert');
            alertBox.className = `alert-box alert-${type}`;
            alertBox.innerText = message;
            alertBox.style.display = 'block';

            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 3500);
        }

        // D-Day 계산 및 남은 시간 포맷팅
        function calculateDDay(dueDateStr) {
            const now = new Date();
            const due = new Date(dueDateStr);
            const diffMs = due - now;

            if (isNaN(due.getTime())) {
                return { text: '날짜 오류', isOverdue: false, diffDays: 0 };
            }

            const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
            const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

            if (diffMs < 0) {
                const absDays = Math.abs(diffDays);
                return { 
                    text: absDays === 0 ? '오늘 마감 지남' : `${absDays}일 지남`, 
                    isOverdue: true, 
                    diffDays 
                };
            } else if (diffDays === 0) {
                return { text: `오늘 마감 (${diffHours}시간 남음)`, isOverdue: false, diffDays, isImminent: true };
            } else {
                return { text: `D-${diffDays}`, isOverdue: false, diffDays, isImminent: diffDays <= 2 };
            }
        }

        // 진행률 계산 (%)
        function calculateProgress(task) {
            if (task.status === 'COMPLETED') return 100;
            if (!task.subtasks || task.subtasks.length === 0) {
                return task.status === 'IN_PROGRESS' ? 50 : 0;
            }
            const completedCount = task.subtasks.filter(st => st.completed).length;
            return Math.round((completedCount / task.subtasks.length) * 100);
        }

        // 과제 등록 및 수정 처리
        function handleFormSubmit(e) {
            e.preventDefault();

            // 입력값 추출
            const taskId = document.getElementById('task-id').value;
            const subject = document.getElementById('subject-name').value.trim();
            const title = document.getElementById('task-title').value.trim();
            const dueDate = document.getElementById('due-date').value;
            const status = document.getElementById('task-status').value;
            const subtasksText = document.getElementById('subtasks-input').value;

            // 예외처리: 필수값 확인
            if (!subject) {
                showAlert('과목명을 입력해 주세요.', 'error');
                document.getElementById('subject-name').focus();
                return;
            }
            if (!title) {
                showAlert('과제명을 입력해 주세요.', 'error');
                document.getElementById('task-title').focus();
                return;
            }
            if (!dueDate) {
                showAlert('마감일을 설정해 주세요.', 'error');
                document.getElementById('due-date').focus();
                return;
            }

            // 예외처리: 날짜 형식 확인
            if (isNaN(new Date(dueDate).getTime())) {
                showAlert('올바른 날짜 형식이 아닙니다.', 'error');
                return;
            }

            // 세부 계획 파싱
            const subtaskLines = subtasksText.split('\n').map(line => line.trim()).filter(line => line.length > 0);
            
            if (taskId) {
                // [수정 규칙]
                const index = tasks.findIndex(t => t.id === taskId);
                if (index === -1) {
                    showAlert('존재하지 않는 과제입니다.', 'error');
                    return;
                }

                // 기존 체크 상태 유지하면서 세부계획 갱신
                const oldSubtasks = tasks[index].subtasks || [];
                const updatedSubtasks = subtaskLines.map((line, idx) => {
                    const existing = oldSubtasks[idx];
                    return {
                        id: existing ? existing.id : 'sub_' + Date.now() + '_' + idx,
                        text: line,
                        completed: existing ? existing.completed : false
                    };
                });

                tasks[index] = {
                    ...tasks[index],
                    subject,
                    title,
                    dueDate,
                    status,
                    subtasks: updatedSubtasks
                };

                showAlert('과제 정보가 성공적으로 수정되었습니다.', 'success');
            } else {
                // [신규 등록 규칙]
                const newSubtasks = subtaskLines.map((line, idx) => ({
                    id: 'sub_' + Date.now() + '_' + idx,
                    text: line,
                    completed: false
                }));

                const newTask = {
                    id: 'task_' + Date.now(),
                    subject,
                    title,
                    dueDate,
                    status,
                    subtasks: newSubtasks
                };

                tasks.push(newTask);
                showAlert('새로운 과제가 등록되었습니다.', 'success');
            }

            saveTasksToStorage();
            resetForm();
            renderTasks();
        }

        // 폼 초기화
        function resetForm() {
            document.getElementById('task-id').value = '';
            document.getElementById('subject-name').value = '';
            document.getElementById('task-title').value = '';
            document.getElementById('due-date').value = '';
            document.getElementById('task-status').value = 'NOT_STARTED';
            document.getElementById('subtasks-input').value = '';

            document.getElementById('form-mode-title').innerText = '새 과제 등록';
            document.getElementById('btn-submit').innerText = '과제 등록';
            document.getElementById('btn-reset-form').style.display = 'none';
        }

        // 수정 모드로 전환
        function editTask(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) {
                showAlert('존재하지 않는 과제입니다.', 'error');
                return;
            }

            document.getElementById('task-id').value = task.id;
            document.getElementById('subject-name').value = task.subject;
            document.getElementById('task-title').value = task.title;
            document.getElementById('due-date').value = task.dueDate;
            document.getElementById('task-status').value = task.status;

            const subtaskText = (task.subtasks || []).map(st => st.text).join('\n');
            document.getElementById('subtasks-input').value = subtaskText;

            document.getElementById('form-mode-title').innerText = '과제 정보 수정';
            document.getElementById('btn-submit').innerText = '수정사항 저장';
            document.getElementById('btn-reset-form').style.display = 'inline-block';

            // 화면 상단으로 스크롤 이동
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 과제 삭제
        function deleteTask(id) {
            const index = tasks.findIndex(t => t.id === id);
            if (index === -1) {
                showAlert('존재하지 않는 과제입니다.', 'error');
                return;
            }

            if (confirm('정말로 이 과제를 삭제하시겠습니까?')) {
                tasks.splice(index, 1);
                saveTasksToStorage();
                showAlert('과제가 삭제되었습니다.', 'info');
                renderTasks();

                // 현재 수정 중이던 항목을 삭제한 경우 폼 리셋
                if (document.getElementById('task-id').value === id) {
                    resetForm();
                }
            }
        }

        // 진행 상태 바로 변경
        function updateStatus(id, newStatus) {
            const task = tasks.find(t => t.id === id);
            if (!task) {
                showAlert('존재하지 않는 과제입니다.', 'error');
                return;
            }

            // 상태값 검증
            if (!['NOT_STARTED', 'IN_PROGRESS', 'COMPLETED'].includes(newStatus)) {
                showAlert('잘못된 상태값입니다.', 'error');
                return;
            }

            task.status = newStatus;
            
            // 완료 상태 변경시 모든 세부계획 자동 체크/해제 처리 옵션
            if (newStatus === 'COMPLETED' && task.subtasks) {
                task.subtasks.forEach(st => st.completed = true);
            }

            saveTasksToStorage();
            showAlert('과제 상태가 변경되었습니다.', 'success');
            renderTasks();
        }

        // 세부 계획 체크박스 토글
        function toggleSubtask(taskId, subtaskId) {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            const subtask = (task.subtasks || []).find(st => st.id === subtaskId);
            if (subtask) {
                subtask.completed = !subtask.completed;

                // 세부계획이 모두 완료되면 과제 상태를 자동으로 '진행 중' 또는 '완료'로 갱신 고려
                const progress = calculateProgress(task);
                if (progress === 100) {
                    task.status = 'COMPLETED';
                } else if (progress > 0 && task.status === 'NOT_STARTED') {
                    task.status = 'IN_PROGRESS';
                }

                saveTasksToStorage();
                renderTasks();
            }
        }

        // 통계 갱신
        function updateStats() {
            document.getElementById('stat-total').innerText = tasks.length;
            document.getElementById('stat-in-progress').innerText = tasks.filter(t => t.status === 'IN_PROGRESS').length;
            document.getElementById('stat-completed').innerText = tasks.filter(t => t.status === 'COMPLETED').length;
        }

        // 과제 목록 렌더링
        function renderTasks() {
            updateStats();

            const taskListEl = document.getElementById('task-list');
            const searchKeyword = document.getElementById('search-input').value.toLowerCase().trim();
            const statusFilter = document.getElementById('status-filter').value;
            const sortOrder = document.getElementById('sort-order').value;

            // 1. 필터링
            let filtered = tasks.filter(task => {
                const matchesSearch = task.subject.toLowerCase().includes(searchKeyword) || 
                                      task.title.toLowerCase().includes(searchKeyword);
                const matchesStatus = statusFilter === 'ALL' || task.status === statusFilter;
                return matchesSearch && matchesStatus;
            });

            // 2. 정렬
            filtered.sort((a, b) => {
                if (sortOrder === 'DUE_ASC') {
                    return new Date(a.dueDate) - new Date(b.dueDate);
                } else if (sortOrder === 'DUE_DESC') {
                    return new Date(b.dueDate) - new Date(a.dueDate);
                } else if (sortOrder === 'TITLE_ASC') {
                    return a.title.localeCompare(b.title);
                }
                return 0;
            });

            // 예외처리: 과제가 없을 경우
            if (filtered.length === 0) {
                taskListEl.innerHTML = `
                    <div class="no-data">
                        <p style="font-size: 16px; font-weight: 600; margin-bottom: 4px;">등록된 과제가 없습니다.</p>
                        <p style="font-size: 13px;">새로운 과제를 등록하여 계획적으로 관리를 시작해보세요!</p>
                    </div>
                `;
                return;
            }

            // HTML 생성
            let html = '';
            filtered.forEach(task => {
                const ddayInfo = calculateDDay(task.dueDate);
                const progress = calculateProgress(task);
                const formattedDate = new Date(task.dueDate).toLocaleString('ko-KR', {
                    year: 'numeric', month: 'long', day: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                });

                // D-day 배지 스타일
                let ddayBadgeClass = 'badge-dday';
                if (task.status === 'COMPLETED') {
                    ddayBadgeClass += ' completed-badge';
                } else if (ddayInfo.isImminent || ddayInfo.isOverdue) {
                    ddayBadgeClass += ' imminent';
                }

                html += `
                    <div class="task-card">
                        <div class="task-header">
                            <div>
                                <span class="task-subject">${escapeHtml(task.subject)}</span>
                                <div class="task-title">${escapeHtml(task.title)}</div>
                            </div>
                            <div class="badges">
                                <span class="badge ${ddayBadgeClass}">${ddayInfo.text}</span>
                                <select class="status-select status-${task.status}" onchange="updateStatus('${task.id}', this.value)">
                                    <option value="NOT_STARTED" ${task.status === 'NOT_STARTED' ? 'selected' : ''}>미시작</option>
                                    <option value="IN_PROGRESS" ${task.status === 'IN_PROGRESS' ? 'selected' : ''}>진행 중</option>
                                    <option value="COMPLETED" ${task.status === 'COMPLETED' ? 'selected' : ''}>완료</option>
                                </select>
                            </div>
                        </div>

                        <!-- 진행률 바 -->
                        <div class="progress-section">
                            <div class="progress-header">
                                <span>수행 진행률</span>
                                <span><strong>${progress}%</strong></span>
                            </div>
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill ${progress === 100 ? 'done' : ''}" style="width: ${progress}%;"></div>
                            </div>
                        </div>

                        <!-- 세부 계획 체크리스트 -->
                        ${task.subtasks && task.subtasks.length > 0 ? `
                            <div class="subtasks-list">
                                ${task.subtasks.map(st => `
                                    <div class="subtask-item ${st.completed ? 'completed' : ''}">
                                        <input type="checkbox" id="${st.id}" ${st.completed ? 'checked' : ''} onchange="toggleSubtask('${task.id}', '${st.id}')">
                                        <label for="${st.id}" style="cursor:pointer;"><span>${escapeHtml(st.text)}</span></label>
                                    </div>
                                `).join('')}
                            </div>
                        ` : ''}

                        <div class="task-footer">
                            <span>🕒 마감일: ${formattedDate}</span>
                            <div>
                                <button class="btn btn-secondary btn-sm" onclick="editTask('${task.id}')">수정</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteTask('${task.id}')">삭제</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            taskListEl.innerHTML = html;
        }

        // HTML 특수문자 이스케이프 (XSS 방지)
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#039;");
        }

        // 모달 관련 기능 (세부 계획 수정용 확장)
        function openSubtaskModal(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;
            document.getElementById('modal-task-id').value = taskId;
            document.getElementById('modal-subtask-text').value = (task.subtasks || []).map(s => s.text).join('\n');
            document.getElementById('subtask-modal').style.display = 'flex';
        }

        function closeSubtaskModal() {
            document.getElementById('subtask-modal').style.display = 'none';
        }

        function saveSubtasksFromModal() {
            const taskId = document.getElementById('modal-task-id').value;
            const text = document.getElementById('modal-subtask-text').value;
            const task = tasks.find(t => t.id === taskId);

            if (task) {
                const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                task.subtasks = lines.map((line, idx) => ({
                    id: 'sub_' + Date.now() + '_' + idx,
                    text: line,
                    completed: false
                }));
                saveTasksToStorage();
                renderTasks();
                closeSubtaskModal();
                showAlert('세부 계획이 수정되었습니다.', 'success');
            }
        }
    </script>
</body>
</html>
